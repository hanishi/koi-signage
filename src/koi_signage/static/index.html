<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venue</title>
<style>
  :root { color-scheme: dark; --bg: #0a0d12; --line: #2a3140; --edge: #4f8cff; --text: #c9d2de; --muted: #7a8596; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
  .screens { display: grid; grid-template-columns: repeat(var(--screens, 3), 1fr); gap: 8px; }
  .screens .screen { aspect-ratio: 16 / 10; border-radius: 6px; }
  .label { color: var(--muted); font-size: 12px; text-align: center; }
  #floor { position: relative; background: #0f131a; border: 1px solid var(--line); border-radius: 6px;
    cursor: crosshair; touch-action: none; user-select: none; }
  .cut { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line); }
  .cut.edge { border-left: 2px solid var(--edge); opacity: .6; }
  .dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    background: #e8edf4; pointer-events: none; }
  .dot.pointer { background: none; border: 2px solid #ffd166; }
  .tag { position: absolute; transform: translate(12px, -50%); pointer-events: none; white-space: nowrap;
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text);
    background: #0a0d12cc; padding: 3px 5px; border-radius: 4px; }
  .tag.pointer { color: #ffd166; }
  .ruler { position: absolute; right: 6px; transform: translateY(-50%); pointer-events: none;
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  #people { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; color: var(--muted);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #people b { color: var(--text); font-weight: 600; }
  #status { display: flex; gap: 16px; color: var(--muted); }
  #status b { color: var(--text); font-weight: 600; }
  #devices { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); }
  #devices button { font: inherit; color: var(--text); background: #161b24; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #devices button:hover { border-color: var(--edge); }
  #devices a { color: var(--edge); margin-left: auto; }
  body.floor-only .screens { display: none; }
  .beyond { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    border-top: 2px dashed #ff8a5b; background: repeating-linear-gradient(135deg, #ff8a5b0d 0 8px, transparent 8px 16px); }
  .beyond span { position: absolute; left: 6px; top: 4px; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #ff8a5b; }
  .dot.far, .tag.far { opacity: .35; }
  .radar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #reach-control { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  #reach-control input { flex: 1; max-width: 360px; accent-color: #ff8a5b; }
  #reach-control b { color: var(--text); font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 5ch; }
</style>
</head>
<body>
<main>
  <div id="devices">
    <span>Screens as windows:</span>
    <a id="layout" href="/?screens=off">Floor only</a>
  </div>
  <div class="screens" id="screens"></div>
  <div class="screens" id="labels"></div>
  <div id="floor"></div>
  <label id="reach-control">Ignore people further than
    <input type="range" id="reach" min="0" step="0.1" disabled>
    <b id="reach-text">–</b>
  </label>
  <div id="status">
    <span>mode <b id="mode">–</b></span><span>people <b id="count">–</b></span>
    <span>screen <b id="screen">–</b></span><span>nearest <b id="nearest">–</b></span>
    <span id="link">floor offline</span>
  </div>
  <ul id="people"></ul>
  <p class="label">Move the pointer over the floor to walk in. Click to leave someone standing (two at most, three with the pointer, as the radar tracks three). Move off the floor to leave.</p>
</main>
<script type="module">
  import { connectScreen, screenElement, SCREEN_CSS } from "/static/screen.js";

  document.head.append(Object.assign(document.createElement("style"), { textContent: SCREEN_CSS }));

  // ?screens=off: this page is only the floor (the radar), and the screens run in their own
  // windows or on devices. Otherwise every screen shows here too, mirrored.
  const floorOnly = new URLSearchParams(location.search).get("screens") === "off";
  document.body.classList.toggle("floor-only", floorOnly);
  const layout = document.getElementById("layout");
  layout.href = floorOnly ? "/" : "/?screens=off";
  layout.textContent = floorOnly ? "Show screens here" : "Floor only";
  const venue = await (await fetch("/venue")).json();
  const screens = venue.screens;  // side by side, numbered from the left
  document.documentElement.style.setProperty("--screens", screens);
  const labels = document.getElementById("labels");
  for (let n = 0; n < screens; n++) {
    labels.append(Object.assign(document.createElement("div"), { className: "label", textContent: `screen ${n}` }));
  }
  if (!floorOnly) {
    const { create } = await import(`/static/creatives/${venue.creative}.js`);
    const row = document.getElementById("screens");
    for (let n = 0; n < screens; n++) {
      const el = screenElement();
      row.append(el);
      connectScreen(n, el, create);
    }
  }

  // One window per screen, side by side across the top of the display. One button each: a
  // click may open only one popup. The window name brings an open one to the front instead of
  // opening a second.
  const layoutLink = document.getElementById("layout");
  for (let n = 0; n < screens; n++) {
    const button = Object.assign(document.createElement("button"), { type: "button", textContent: `Screen ${n}` });
    layoutLink.before(button);
    button.addEventListener("click", () => {
      const width = Math.floor(screen.availWidth / screens);
      const height = Math.round((width * 10) / 16);
      const left = (screen.availLeft ?? 0) + n * width;
      const top = screen.availTop ?? 0;
      const w = window.open(`/screen?n=${n}`, `screen-${n}`,
        `popup,left=${left},top=${top},width=${width},height=${height}`);
      w?.focus();
    });
  }
  // Stands in for Promovolve's schedule, as the pointer stands in for the radar: every screen
  // plays the clip for 10 s, then the koi come back.
  if (venue.ads.length) {
    const ad = Object.assign(document.createElement("button"), { type: "button", textContent: "Play an ad" });
    ad.title = `${venue.ads[0]} on every screen for 10 s`;
    layoutLink.before(ad);
    ad.addEventListener("click", () => fetch("/ads", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ clip: venue.ads[0], seconds: 10 }),
    }));
  }

  const floorEl = document.getElementById("floor");
  floorEl.style.aspectRatio = `${venue.width_m} / ${venue.depth_m}`;
  venue.zone_cuts_m.forEach((x, i) => {
    const cut = document.createElement("div");
    cut.className = i % 3 === 2 ? "cut edge" : "cut";  // every third cut is a screen boundary
    cut.style.left = `${(x / venue.width_m) * 100}%`;
    floorEl.append(cut);
  });

  // What the LD2450 sees: a sector from where it is mounted on the screen line, ±fov/2 either
  // side of straight out, to range_m. Outside it is shaded: nobody there is seen.
  const radar = venue.radar;
  const half = (radar.fov_deg / 2) * (Math.PI / 180);
  const inView = (p) => {
    const dx = p.x - radar.x_m;
    return Math.hypot(dx, p.y) <= radar.range_m && Math.atan2(Math.abs(dx), p.y) <= half;
  };
  {
    const R = radar.range_m, sx = radar.x_m;
    const [x1, x2, y] = [sx - R * Math.sin(half), sx + R * Math.sin(half), R * Math.cos(half)];
    const sector = `M ${sx} 0 L ${x1} ${y} A ${R} ${R} 0 ${half > Math.PI / 2 ? 1 : 0} 0 ${x2} ${y} Z`;
    floorEl.insertAdjacentHTML("beforeend", `
      <svg class="radar" viewBox="0 0 ${venue.width_m} ${venue.depth_m}" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 0 0 H ${venue.width_m} V ${venue.depth_m} H 0 Z ${sector}" fill="#05070a" fill-opacity=".6" fill-rule="evenodd"/>
        <path d="${sector}" fill="none" stroke="#4f8cff" stroke-opacity=".55" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <circle cx="${sx}" cy="0" r="0.09" fill="#4f8cff"/>
      </svg>`);
  }

  let pointer = null;
  const standing = [];
  const MAX_STANDING = 2;

  const metres = (e) => {
    const r = floorEl.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * venue.width_m,
             y: ((e.clientY - r.top) / r.height) * venue.depth_m };
  };
  const targets = () => [...(pointer ? [pointer] : []), ...standing];

  // Distance is y: metres from the screens, 0 at the floor's top edge, as the LD2450 reports
  // it facing out from the screens. A point on a screen boundary belongs to the screen on its
  // right, as on the server.
  const metresText = (v) => `${v.toFixed(2)} m`;
  const screenOf = (x) => Math.floor(venue.zone_cuts_m.filter((c) => c <= x).length / 3);

  for (let m = 1; m < venue.depth_m; m++) {  // a distance scale on the floor's right edge
    const r = document.createElement("div");
    r.className = "ruler";
    r.style.top = `${(m / venue.depth_m) * 100}%`;
    r.textContent = `${m} m`;
    floorEl.append(r);
  }

  // The cut-off: the server (the Floor actor) drops anyone further than this before the
  // character sees them. It sends the value on connect and after every change, so the line
  // shows what is in force, not just where the slider is.
  let reach = null;
  const beyond = document.createElement("div");
  beyond.className = "beyond";
  beyond.hidden = true;
  beyond.append(document.createElement("span"));
  floorEl.append(beyond);
  const slider = document.getElementById("reach");
  slider.max = venue.depth_m;
  const far = (p) => reach !== null && p.y > reach;
  const why = (p) => (!inView(p) ? "out of the radar's view" : far(p) ? "too far" : null);

  function showReach(m) {
    reach = m;
    slider.disabled = false;
    if (document.activeElement !== slider) slider.value = m;
    document.getElementById("reach-text").textContent = metresText(m);
    beyond.hidden = m >= venue.depth_m;
    beyond.style.top = `${(m / venue.depth_m) * 100}%`;
    beyond.firstChild.textContent = `ignored beyond ${metresText(m)}`;
    draw();
  }
  slider.addEventListener("input", () => {
    if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ max_distance_m: Number(slider.value) }));
  });

  function draw() {
    floorEl.querySelectorAll(".dot, .tag").forEach((d) => d.remove());
    const people = [...(pointer ? [[pointer, "pointer"]] : []), ...standing.map((p) => [p, ""])];
    for (const [p, kind] of people) {
      const left = `${(p.x / venue.width_m) * 100}%`;
      const top = `${(p.y / venue.depth_m) * 100}%`;
      const d = document.createElement("div");
      const ignored = why(p) ? "far" : "";
      d.className = `dot ${kind} ${ignored}`;
      d.style.left = left;
      d.style.top = top;
      const tag = document.createElement("div");
      tag.className = `tag ${kind} ${ignored}`;
      tag.style.left = left;
      tag.style.top = top;
      tag.textContent = metresText(p.y) + (!inView(p) ? ", unseen" : ignored ? ", ignored" : "");
      floorEl.append(d, tag);
    }
    const list = document.getElementById("people");
    list.replaceChildren(...people.map(([p, kind], i) => {
      const li = document.createElement("li");
      const who = kind === "pointer" ? "pointer" : `standing ${i + (pointer ? 0 : 1)}`;
      li.innerHTML = `${who}: <b>${metresText(p.y)}</b> away · x ${metresText(p.x)} · `
        + (why(p) ? `ignored, ${why(p)}` : `screen ${screenOf(p.x)}`);
      return li;
    }));
    const counted = people.filter(([p]) => !why(p));
    const nearest = counted.length ? Math.min(...counted.map(([p]) => p.y)) : null;
    document.getElementById("nearest").textContent = nearest === null ? "–" : metresText(nearest);
  }

  let ws;
  let backoff = 0.5;
  let queued = false;
  function send() {
    draw();
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {  // at most one frame per animation frame
      queued = false;
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ targets: targets() }));
    });
  }

  floorEl.addEventListener("pointermove", (e) => { pointer = metres(e); send(); });
  floorEl.addEventListener("pointerleave", () => { pointer = null; send(); });
  floorEl.addEventListener("click", (e) => {
    const p = metres(e);
    const near = standing.findIndex((s) => Math.hypot(s.x - p.x, s.y - p.y) < 0.3);
    if (near >= 0) standing.splice(near, 1);
    else if (standing.length < MAX_STANDING) standing.push(p);
    send();
  });

  function open() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/floor`);
    ws.onopen = () => { backoff = 0.5; document.getElementById("link").textContent = ""; send(); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "settings") return showReach(m.max_distance_m);
      if (m.type !== "status") return;
      document.getElementById("mode").textContent = m.mode;
      document.getElementById("count").textContent = m.count;
      document.getElementById("screen").textContent = m.screen;
    };
    ws.onclose = () => {
      document.getElementById("link").textContent = "floor offline, reconnecting";
      setTimeout(open, backoff * 1000);
      backoff = Math.min(backoff * 2, 8);
    };
  }
  open();
</script>
</body>
</html>

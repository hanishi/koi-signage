[project]
name = "koi-signage"
version = "0.1.0"
description = "People-reactive signage on ohra actors: a koi that idles, follows one person, or swims toward a crowd across three screens, driven by an mmWave radar (or your mouse)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Haruhiko Nishi" }]
requires-python = ">=3.12"
dependencies = ["ohra[web]>=0.5.1"]
keywords = ["signage", "digital-signage", "actors", "ohra", "mmwave", "ld2450", "raspberry-pi", "koi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hanishi/koi-signage"
Issues = "https://github.com/hanishi/koi-signage/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pyright>=1.1.380",
    "ruff>=0.17",
    "httpx2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
koi_signage = ["py.typed", "static/**/*", "venue.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# the suite takes about 2 s: a test still running after 10 s is stuck, so fail it, don't wait
timeout = 10

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "N"]

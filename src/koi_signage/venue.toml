# Calibration for one site. A real radar reads off and real people stand in odd places,
# so these are set per venue, not in code.

[floor]
screens = 3             # side by side, numbered 0, 1, 2 from the left
width_m = 9.0
depth_m = 4.0
zone_cuts_m = [1, 2, 3, 4, 5, 6, 7, 8]   # 3 zones per screen, so 3 × screens − 1 cuts, left to right
max_distance_m = 3.0   # further from the screens than this is ignored (the floor page has a slider)

[screen]
creative = "koi"        # what the screens show: static/creatives/<name>.js

[radar]                 # one HLK-LD2450 on the screen line, facing the floor
# x_m = 4.5             # where along the corridor it is mounted; the middle of the floor if unset
range_m = 6.0           # it sees this far, measured from the sensor
fov_deg = 120.0         # and this wide: ±60° either side of straight out

[ads]
# dir = "ads"           # your clips, relative to this file; the sample that ships if unset

[character]
follow_after_s = 1.0    # 1 person this long → Follow
crowd_after_s = 1.0     # 2+ this long → Crowd
idle_after_s = 3.0      # 0 this long → Idle
crowd_lead_s = 1.0      # a screen must lead this long before the character moves toward it
linger_s = 3.0          # after arriving, stay at least this long (crowd mode)
dead_zone_m = 0.3       # half-width of the band around a screen boundary
handoff_lead_s = 0.15   # exit/enter time t = now + this
ready_timeout_s = 1.0   # a screen that hasn't sent ready by then is handed off to anyway
